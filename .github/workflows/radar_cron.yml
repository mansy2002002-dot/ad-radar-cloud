name: Meta Ad Radar

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Optional: comma-separated keywords (up to 12); blank rotates categories'
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: meta-ad-radar
  cancel-in-progress: false

jobs:
  scrape-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run Meta Ad Library collector
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          MIN_LIVE_DAYS: '30'
          COUNTRY_CODE: EG
          TERMS_PER_RUN: '4'
          SEARCH_KEYWORDS: ${{ inputs.keywords }}
        run: npm run meta
      - name: Save search diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-search-summary
          path: diagnostics/meta-summary.json
          if-no-files-found: ignore
          retention-days: 7
